[project]
name = "uwm-better-schedule"
version = "0.1.0"
description = "Production-grade modular timetable parser, editor, and PDF reconstructor"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [
    { name = "Nexeros", email = "picasso.vol2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15.6755",
    "pdfplumber>=0.11.0",
    "pydantic>=2.10.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
uwm-schedule = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
