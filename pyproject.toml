[project]
name = "uwm-better-schedule"
version = "0.1.0"
description = "Production-grade modular timetable parser, editor, and PDF reconstructor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.0",
    "pydantic>=2.10.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "rich>=13.0.0",
]

[project.scripts]
uwm-schedule = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
